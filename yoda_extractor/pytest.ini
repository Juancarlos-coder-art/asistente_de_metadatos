[pytest]
testpaths = tests/unit
markers =
    integration: marks tests as integration tests that call the full pipeline and require GEMINI_API_KEY (run with: pytest tests/integration/)
addopts =
    --cov=extractors
    --cov=utils
    --cov=readers
    --cov-report=term-missing
    --cov-report=html:tests/unit/coverage_html
    --cov-config=pytest.ini

[coverage:run]
omit =
    tests/*
    tests-tmp/*
