            es: Custodio — Parte que acepta la rendición de cuentas y la responsabilidad por el recurso y garantiza una atención y un mantenimiento adecuados de los recursos
            en: Custodian – Party that accepts accountability and responsibility for the resource and ensures appropriate care and maintenance of the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#distributor
          label:
            es: Distribuidor — Parte que distribuye el recurso
            en: Distributor – Party who distributes the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#publisher
          label:
            es: Editor — Parte que publicó el recurso
            en: Publisher – Party who published the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#editor
          label:
            es: Editor — Parte que revisó o modificó el recurso para mejorar el contenido
            en: Editor – Party who reviewed or modified the resource to improve the content
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#processor
          label:
            es: Encargado del tratamiento — Parte que ha tratado los datos de manera que el recurso ha sido modificado
            en: Processor – Party who has processed the data in a manner such that the resource has been modified
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#funder
          label:
            es: Financiador — Parte que presta apoyo monetario al recurso
            en: Funder – Party providing monetary support for the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#principalInvestigator
          label:
            es: Investigador principal — Parte clave responsable de recopilar información y llevar a cabo la investigación
            en: Principal Investigator – Key party responsible for gathering information and conducting research
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#mediator
          label:
            es: Mediador - clase de entidad que media en el acceso al recurso y a la que se destina o es útil el recurso
            en: Mediator – A class of entity that mediates access to the resource and for whom the resource is intended or useful
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#originator
          label:
            es: Originador — Parte que creó el recurso
            en: Originator – Party who created the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#stakeholder
          label:
            es: Parte interesada — Parte que tiene un interés en el recurso o en la utilización del recurso
            en: Stakeholder – Party who has an interest in the resource or the use of the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#sponsor
          label:
            es: Patrocinador — Parte que habla por el recurso
            en: Sponsor – Party who speaks for the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#owner
          label:
            es: Propietario — Parte propietaria del recurso
            en: Owner – Party that owns the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#resourceProvider
          label:
            es: Proveedor de recursos - Parte que suministra el recurso
            en: Resource Provider – Party that supplies the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#pointOfContact
          label:
            es: Punto de contacto — Parte a la que se puede contactar para adquirir conocimientos o adquirir el recurso
            en: Point Of Contact – Party who can be contacted for acquiring knowledge about or acquisition of the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#rightsHolder
          label:
            es: Titular de los derechos — Parte que posee o gestiona derechos sobre el recurso
            en: Rights Holder – Party owning or managing rights over the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#user
          label:
            es: Usuario — Parte que utiliza el recurso
            en: User – Party who uses the resource

