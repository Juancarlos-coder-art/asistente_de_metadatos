- field_name: health_category
  label:
    es: Categoría sanitaria
    en: Health category
  form_snippet: health_category_repeat_select.html
  display_snippet: choice_link.html
  preset: multiple_checkbox
  required: true
  choices:
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/HRAD
      label:
        es: Datos administrativos relacionados con la salud, incluidos los datos de dispensación, reclamaciones y reembolsos
        en: Healthcare-related administrative data, including on dispensations, reimbursement claims and reimbursements
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/NRPE
      label:
        es: Datos agregados sobre las necesidades de atención sanitaria, los recursos asignados a la atención sanitaria, la prestación y el acceso a la atención sanitaria, el gasto sanitario y la financiación
        en: Aggregated data on healthcare needs, resources allocated to healthcare, the provision of and access to healthcare, healthcare expenditure and financing
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/WELA
      label:
        es: Datos de aplicaciones de bienestar
        en: Data from wellness applications
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/RQSH
      label:
        es: Datos de cohortes de investigación, cuestionarios y encuestas relacionados con la salud, tras la primera publicación de los resultados
        en: Data from research cohorts, questionnaires and surveys related to health, after the first publication of the related results
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/EHCT
      label:
        es: Datos de ensayos clínicos, estudios clínicos e investigaciones clínicas sujetos respectivamente al Reglamento (UE) 536/2014, al Reglamento [SOHO], al Reglamento (UE) 2017/745 y al Reglamento (UE) 2017/746
        en: Data from clinical trials, clinical studies, clinical investigations and performance studies subject to Regulation (EU) No 536/2014, Regulation (EU) 2024/1938 of the European Parliament and of the Council34, Regulation (EU) 2017/745 and Regulation (EU) 2017/746
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/RPDG
      label:
        es: Datos de patógenos que afectan a la salud humana
        en: Data on pathogens that impact human health
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/RMMD
      label:
        es: Datos de registros de productos medicinales y dispositivos médicos
        en: Data from registries for medicinal products and medical devices
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/MRMR
      label:
        es: Datos de registros médicos y registros de mortalidad
        en: Data from medical registries and mortality registries
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/EINS
      label:
        es: Datos de salud de biobancos y bases de datos asociadas
        en: Health data from biobanks and associated databases
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/PGEH
      label:
        es: Datos electrónicos de salud personales generados automáticamente a través de dispositivos médicos
        en: Personal electronic health data automatically generated through medical devices
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/HGPD
      label:
        es: Datos genéticos, epigenómicos y genómicos humanos
        en: Human genetic, epigenomic and genomic data
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/IDHP
      label:
        es: Datos sobre el estado profesional, la especialización y la institución de los profesionales de la salud involucrados en el tratamiento de una persona física
        en: Data on professional status, and on the specialisation and institution of health professionals involved in the treatment of a natural person
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/DIOH
      label:
        es: Datos sobre factores que afectan a la salud, incluidos los determinantes socioeconómicos, ambientales y de comportamiento de la salud
        en: Data on factors impacting on health, including socio-economic, environmental and behavioural determinants of health
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/EMRD
      label:
        es: Otros datos de salud de dispositivos médicos
        en: Other health data from medical devices
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/HPML
      label:
        es: Otros datos moleculares humanos como datos proteómicos, transcriptómicos, metabolómicos, lipidómicos y otros datos ómicos
        en: Other human molecular data such as proteomic, transcriptomic, metabolomic, lipidomic and other omic data
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/PHDR
      label:
        es: Registros de datos de salud basados en la población (registros de salud pública)
        en: Data from population-based health data registries such as public health registries
    - value: http://13.81.34.152:1101/resource/authority/healthcategories/EHRS
      label:
        es: Registros Electrónicos de Salud
        en: Electronic Health Data from EHRs
  
