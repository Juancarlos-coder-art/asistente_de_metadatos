resource_fields:
- field_name: url
  label:
    es: URL
    en: URL
  preset: resource_url_upload

- field_name: name
  label:
    es: Nombre
    en: Name

- field_name: description
  label:
    es: Descripción
    en: Description
  form_snippet: markdown.html

- field_name: format
  label:
    es: Formato
    en: Format
  preset: resource_format_autocomplete

- field_name: mimetype
  label:
    es: Tipo de medio
    en: Media type
  validators: if_empty_guess_format ignore_missing unicode_safe

- field_name: compress_format
  label:
    es: Formato de compresión
    en: Compress format

- field_name: package_format
  label:
    es: Formato de empaquetado
    en: Package format

- field_name: size
  label:
    es: Tamaño
    en: Size
  validators: ignore_missing int_validator
  form_snippet: number.html
  display_snippet: file_size.html

- field_name: hash
  label:
    es: Hash
    en: Hash

- field_name: hash_algorithm
  label:
    es: Algoritmo hash
    en: Hash algorithm

- field_name: rights
  label:
    es: Derechos
    en: Rights
  form_snippet: markdown.html
  display_snippet: markdown.html

- field_name: availability
  label:
    es: Disponibilidad
    en: Availability

- field_name: status
  label:
    es: Estado
    en: Status
  preset: select
  choices:
    - value: http://purl.org/adms/status/Completed
      label:
        es: Completado
        en: Completed
    - value: http://purl.org/adms/status/UnderDevelopment
      label:
        es: En desarrollo
        en: Under Development
    - value: http://purl.org/adms/status/Deprecated
      label:
        es: Obsoleto
        en: Deprecated
    - value: http://purl.org/adms/status/Withdrawn
      label:
        es: Retirado
        en: Withdrawn

- field_name: license
  label:
    es: Licencia
    en: License

- field_name: access_url
  label:
    es: URL de acceso
    en: Access URL

- field_name: download_url
  label:
    es: URL de descarga
    en: Download URL
  display_snippet: link.html
  
- field_name: retention_period
  label:
    es: Periodo de conservación
    en: Retention period
  repeating_label:
    es: Periodo de conservación
    en: Retention period
  repeating_once: true
  repeating_subfields:
    - field_name: start
      label:
        es: Inicio
        en: Start
      preset: dcat_date
    - field_name: end
      label:
        es: Fin
        en: End
      preset: dcat_date
- field_name: applicable_legislation
  label:
    es: Legislación aplicable
    en: Applicable legislation
  repeating_label:
    es: Legislación aplicable
    en: Applicable legislation
  form_snippet: applicable_legislation_form.html
  display_snippet: applicable_legislation_display.html
  repeating_subfields:
    - field_name: uri
      label:
        es: URI
        en: URI
      required: true
    - field_name: label
      label:
        es: Etiqueta
        en: Label
