        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#collaborator
          label:
            es: Colaborador — Parte que asiste a la generación del recurso distinto del investigador principal
            en: Collaborator – Party who assists with the generation of the resource other than the principal investigator
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#contributor
          label:
            es: Contribuyente — Parte que contribuye al recurso
            en: Contributor – Party contributing to the resource
        - value: https://standards.iso.org/iso/19115/resources/Codelists/gml/CI_RoleCode.xml#custodian
